<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>不要一個人喝酒</title>
  <link rel="stylesheet" href="common.css">
  <style>
    /* Splash screen - redirect to home.html on mobile, show showcase on desktop */
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }

    .splash-logo {
      font-size: 80px; margin-bottom: 20px;
      animation: float 2s ease-in-out infinite;
    }
    .splash-title {
      font-size: 28px; font-weight: 900; text-align: center;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple), var(--neon-blue));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .splash-sub {
      font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 40px;
    }
    .splash-enter {
      display: inline-block; padding: 14px 48px; border-radius: 30px;
      font-size: 16px; font-weight: 700; text-decoration: none;
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      color: white; box-shadow: var(--shadow-neon-pink);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .splash-enter:active { transform: scale(0.95); }

    /* Quick page links grid */
    .page-links {
      margin-top: 50px; display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; max-width: 360px; width: 100%; padding: 0 20px;
    }
    .page-link {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 16px 8px; border-radius: 14px; text-decoration: none;
      background: var(--bg-card); border: 1px solid var(--border-color);
      transition: border-color 0.3s;
    }
    .page-link:hover { border-color: var(--neon-pink); }
    .page-link .pl-emoji { font-size: 28px; }
    .page-link .pl-name { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
  </style>
</head>
<body>
  <div class="splash-logo">🍸</div>
  <div class="splash-title">不要一個人喝酒</div>
  <div class="splash-sub">Don't Drink Alone</div>
  <a href="home.html" class="splash-enter">進入 App</a>

  <div class="page-links">
    <a href="home.html" class="page-link">
      <span class="pl-emoji">🏠</span>
      <span class="pl-name">首頁</span>
    </a>
    <a href="moments.html" class="page-link">
      <span class="pl-emoji">📸</span>
      <span class="pl-name">動態</span>
    </a>
    <a href="party.html" class="page-link">
      <span class="pl-emoji">🍻</span>
      <span class="pl-name">約酒局</span>
    </a>
    <a href="explore.html" class="page-link">
      <span class="pl-emoji">🗺️</span>
      <span class="pl-name">探索</span>
    </a>
    <a href="messages.html" class="page-link">
      <span class="pl-emoji">💬</span>
      <span class="pl-name">消息</span>
    </a>
    <a href="profile.html" class="page-link">
      <span class="pl-emoji">👤</span>
      <span class="pl-name">我的</span>
    </a>
    <a href="bar-detail.html" class="page-link">
      <span class="pl-emoji">🍸</span>
      <span class="pl-name">酒吧詳情</span>
    </a>
    <a href="coin-shop.html" class="page-link">
      <span class="pl-emoji">🪙</span>
      <span class="pl-name">幣幣商城</span>
    </a>
    <a href="login.html" class="page-link">
      <span class="pl-emoji">🔐</span>
      <span class="pl-name">登入</span>
    </a>
    <a href="party-create.html" class="page-link">
      <span class="pl-emoji">✏️</span>
      <span class="pl-name">發起酒局</span>
    </a>
    <a href="share-table.html" class="page-link">
      <span class="pl-emoji">🪑</span>
      <span class="pl-name">拚桌實況</span>
    </a>
    <a href="publish.html" class="page-link">
      <span class="pl-emoji">📝</span>
      <span class="pl-name">發佈</span>
    </a>
  </div>

  <script>
    // Auto-redirect on mobile
    if (window.innerWidth <= 500 && !window.location.search.includes('show=splash')) {
      window.location.replace('home.html');
    }
  </script>
</body>
</html>
