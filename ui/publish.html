<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>不要一個人喝酒 - 發佈頁 Publish</title>
  <link rel="stylesheet" href="common.css">
  <style>
    /* Header */
    .publish-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .publish-header .cancel-btn {
      font-size: 14px;
      color: var(--text-secondary);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Noto Sans TC', sans-serif;
    }

    .publish-header .post-btn {
      padding: 8px 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      color: white;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: var(--shadow-neon-pink);
      font-family: 'Noto Sans TC', sans-serif;
    }

    /* Publish Type Selector */
    .publish-types {
      display: flex;
      gap: 8px;
      padding: 16px 20px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .publish-types::-webkit-scrollbar { display: none; }

    .pub-type {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .pub-type.active {
      border-color: var(--neon-pink);
      background: rgba(255, 45, 149, 0.1);
      box-shadow: var(--shadow-neon-pink);
    }

    .pub-type .pub-icon {
      font-size: 20px;
    }

    .pub-type .pub-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .pub-type.active .pub-text {
      color: var(--neon-pink);
    }

    /* Bar Selector */
    .bar-selector {
      margin: 0 20px 16px;
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .bar-selector:hover {
      border-color: var(--neon-blue);
    }

    .bar-selector .bs-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: var(--glass-bg);
    }

    .bar-selector .bs-info {
      flex: 1;
    }

    .bar-selector .bs-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .bar-selector .bs-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .bar-selector .bs-arrow {
      fill: var(--text-muted);
    }

    /* Check-in Badge */
    .checkin-badge {
      margin: 0 20px 16px;
      padding: 10px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(57, 255, 20, 0.1), rgba(0, 212, 255, 0.1));
      border: 1.5px solid var(--neon-green);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .checkin-badge .cb-icon {
      font-size: 22px;
    }

    .checkin-badge .cb-text {
      font-size: 13px;
      color: var(--neon-green);
      font-weight: 600;
    }

    .checkin-badge .cb-coin {
      margin-left: auto;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(57, 255, 20, 0.2);
      color: var(--neon-green);
      font-size: 12px;
      font-weight: 700;
    }

    /* Photo Upload Area */
    .photo-upload {
      margin: 0 20px 16px;
    }

    .photo-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .photo-slot {
      width: 100px;
      height: 100px;
      border-radius: 12px;
      border: 1.5px dashed var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }

    .photo-slot:hover {
      border-color: var(--neon-purple);
      background: rgba(184, 41, 221, 0.05);
    }

    .photo-slot svg {
      width: 24px;
      height: 24px;
      fill: var(--text-muted);
    }

    .photo-slot span {
      font-size: 10px;
      color: var(--text-muted);
    }

    .photo-slot.filled {
      border: none;
      border-radius: 12px;
      overflow: hidden;
    }

    .photo-slot.filled .remove-photo {
      position: fixed;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .photo-slot.filled .remove-photo svg {
      width: 12px;
      height: 12px;
      fill: white;
    }

    /* Text Input */
    .text-input-area {
      margin: 0 20px 16px;
    }

    .text-input-area textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 14px;
      font-family: 'Noto Sans TC', sans-serif;
      line-height: 1.6;
      outline: none;
      resize: none;
      transition: all 0.3s;
    }

    .text-input-area textarea:focus {
      border-color: var(--neon-purple);
      box-shadow: var(--shadow-neon-purple);
    }

    .text-input-area textarea::placeholder {
      color: var(--text-muted);
    }

    .char-count {
      text-align: right;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Mood / Vibe Selector */
    .vibe-section {
      padding: 0 20px 16px;
    }

    .vibe-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      font-weight: 500;
    }

    .vibe-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .vibe-option {
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s;
    }

    .vibe-option.selected {
      border-color: var(--neon-yellow);
      color: var(--neon-yellow);
      background: rgba(255, 230, 0, 0.1);
      box-shadow: inset 0 0 10px rgba(255, 230, 0, 0.05);
    }

    /* Rating */
    .rating-section {
      padding: 0 20px 16px;
    }

    .rating-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      font-weight: 500;
    }

    .rating-stars {
      display: flex;
      gap: 8px;
    }

    .rating-star {
      font-size: 32px;
      cursor: pointer;
      transition: all 0.3s;
      opacity: 0.3;
    }

    .rating-star.active {
      opacity: 1;
      text-shadow: 0 0 10px var(--neon-yellow);
    }

    /* Tags */
    .tags-section {
      padding: 0 20px 16px;
    }

    .tags-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      font-weight: 500;
    }

    .tag-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag-option {
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s;
    }

    .tag-option.selected {
      border-color: var(--neon-blue);
      color: var(--neon-blue);
      background: rgba(0, 212, 255, 0.1);
    }

    /* Location toggle */
    .location-toggle {
      margin: 0 20px 16px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle-switch {
      width: 44px;
      height: 24px;
      border-radius: 12px;
      background: var(--neon-green);
      position: relative;
      cursor: pointer;
    }

    .toggle-switch .toggle-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: white;
      position: absolute;
      top: 2px;
      right: 2px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .toggle-switch.off {
      background: var(--text-muted);
    }

    .toggle-switch.off .toggle-dot {
      right: auto;
      left: 2px;
    }

    .location-toggle .lt-text {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .location-toggle .lt-icon {
      font-size: 18px;
    }

    /* page-body safe-bottom padding for sub-page */
    .page-body {
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
  </style>
</head>
<body>
  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">16:38</span>
    <div class="icons">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </div>
  </div>

  <div class="page-body">
    <!-- Header -->
    <div class="publish-header">
      <button class="cancel-btn" onclick="history.back()">取消</button>
      <span style="font-size: 16px; font-weight: 700;">發佈動態</span>

    <!-- Publish Type -->
    <div class="publish-types">
      <div class="pub-type active">

      </div>
      <div class="pub-type">
        <span class="pub-icon">⭐</span>
        <span class="pub-text">評論</span>
      </div>
      <div class="pub-type">
        <span class="pub-icon">🍻</span>
        <span class="pub-text">酒吧推薦</span>
      </div>
      <div class="pub-type">
        <span class="pub-icon">📸</span>
        <span class="pub-text">打卡</span>
      </div>
    </div>

    <!-- Bar Selector -->
    <div class="bar-selector">
      <div class="bs-icon">🍸</div>
      <div class="bs-info">
        <div class="bs-label">選擇酒吧</div>
        <div class="bs-name">Rabbit Hole Bar</div>
      </div>
      <svg class="bs-arrow" width="16" height="16" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
    </div>

    <!-- Check-in Badge -->
    <div class="checkin-badge">
      <div class="cb-icon">📍</div>
      <div class="cb-text">已打卡 Rabbit Hole Bar</div>
      <div class="cb-coin">+5 幣幣</div>
    </div>

    <!-- Photo Upload -->
    <div class="photo-upload">
      <div class="photo-grid">
        <div class="photo-slot filled">
          <div class="img-placeholder bar3" style="width:100%;height:100%;"></div>
          <div class="remove-photo">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </div>
        </div>
        <div class="photo-slot filled">
          <div class="img-placeholder bar1" style="width:100%;height:100%;"></div>
          <div class="remove-photo">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </div>
        </div>
        <div class="photo-slot">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          <span>添加照片</span>
        </div>
      </div>
    </div>

    <!-- Text Input -->
    <div class="text-input-area">
      <textarea placeholder="分享你今晚的喝酒體驗吧... 🍻"></textarea>
      <div class="char-count">0 / 500</div>
    </div>

    <!-- Rating -->
    <div class="rating-section">
      <div class="rating-label">你的評分</div>
      <div class="rating-stars">
        <span class="rating-star active">★</span>
        <span class="rating-star active">★</span>
        <span class="rating-star active">★</span>
        <span class="rating-star active">★</span>
        <span class="rating-star">★</span>
      </div>
    </div>

    <!-- Vibe Tags -->
    <div class="vibe-section">
      <div class="vibe-label">今晚的氛圍</div>
      <div class="vibe-options">
        <div class="vibe-option selected">🕺 派對</div>
        <div class="vibe-option">😌 放鬆</div>
        <div class="vibe-option selected">🎶 音樂</div>
        <div class="vibe-option">💑 約會</div>
        <div class="vibe-option">🤝 社交</div>
        <div class="vibe-option">🎭 主題</div>

    </div>

    <!-- Tags -->
    <div class="tags-section">
      <div class="tags-label">標籤</div>
      <div class="tag-options">
        <div class="tag-option selected">#曼谷喝酒</div>
        <div class="tag-option">#威士忌</div>

        <div class="tag-option">#素坤逸</div>
        <div class="tag-option">+ 自訂</div>

    </div>

    <!-- Location -->
    <div class="location-toggle">
      <span class="lt-icon">📍</span>
      <div class="lt-text" style="flex:1;">顯示當前位置</div>
      <div class="toggle-switch">
        <div class="toggle-dot"></div>
      </div>
    </div>

    <div style="height: 100px;"></div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">

      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>

    </div>

      <span>動態</span>
    </div>
    <div class="nav-item party-tab" onclick="location.href='party.html'">

        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
      </div>

    <div class="nav-item" onclick="location.href='messages.html'">

  </div>
</body>
</html>
